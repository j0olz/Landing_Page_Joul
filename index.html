<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Seif Joul | Virtual Resume</title>
  <!-- Open Graph (cat 7) -->
  <meta property="og:title"       content="Seif-Eddine Joul – Mechatronics Engineer" />
  <meta property="og:description" content="Virtual resume of Seif-Eddine Joul: projects, experience, skills, and education." />
  <meta property="og:image"       content="icons/face.jpeg" />
  <meta property="og:type"        content="website" />
  <!-- Favicon placeholder -->
  <link rel="icon" href="icons/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header id="site-header"></header>

<div id="floating-buttons"></div>

<section class="index-who">
  <!-- Hook line (2.3) injected here -->
  <!-- <p class="who-hook" id="who-hook"></p> -->
  <h2 id="who-title"></h2>
  <p id="who-body"></p>
  <h2 id="who-closing"></h2>
</section>

<section class="content-section">
  <h2 id="virtual-cv-title"></h2>
  <p style="max-width:800px;margin:0 auto 2rem auto;">
    <!-- <bdi dir="ltr">Navigate through different aspects of my professional and personal journey.
    Each section provides detailed insights into my experiences, skills, and achievements.</bdi> -->
  </p>
  <div class="index-cards-grid" id="index-cards"></div>
  <p class="cards-swipe-hint" id="cards-swipe-hint"></p>
</section>

<section id="site-contact"></section>
<footer id="site-footer"></footer>

<script src="render.js"></script>
<script src="main.js"></script>
<script>
  SiteRender.bootstrapPage({
    activePage: null,
    showHomeBtn: false,
    renderBody(content) {
      const { index, ui } = content;

      // document.getElementById('who-hook').textContent =
      //   'I build things that move, sense, and respond; I lead the people who build them with me.';

      document.getElementById('who-title').textContent = ui.whoTitle;
      document.getElementById('virtual-cv-title').textContent = ui.virtualCvTitle;

      document.getElementById('who-body').innerHTML =
        index.whoAmI.replace(/\n\n/g, '<br><br>');
      const whoClosingEl = document.getElementById('who-closing');
      whoClosingEl.textContent = index.whoAmIClosing;
      // Mirror the closing line to the opposite side from the title,
      // for both LTR (English/French) and RTL (Arabic) layouts.
      const isRTL = document.documentElement.dir === 'rtl';
      whoClosingEl.style.textAlign = isRTL ? 'left' : 'right';

      document.getElementById('index-cards').innerHTML = index.cards.map(c => `
        <a href="${c.href}" class="index-card">
          <div class="index-cards-icon"><img src="${c.icon}" alt="${c.label}" class="icons"></div>
          <h3>${c.label}</h3>
        </a>
      `).join('');

      // Show swipe navigation hint on mobile
      const swipeHint = document.getElementById('cards-swipe-hint');
      if (swipeHint) {
        swipeHint.textContent = ui.cardsSwipeHint;
      }
    }
  });
</script>

</body>
</html>
