<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Career | Seif Joul</title>
  <meta property="og:title"       content="Career – Seif-Eddine Joul" />
  <meta property="og:description" content="Career timeline: Electromechanical Engineer, Field Technician, Operations Leader." />
  <meta property="og:image"       content="icons/face.png" />
  <link rel="icon" href="icons/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header id="site-header"></header>
<nav    id="site-nav"></nav>
<div   id="floating-buttons"></div>

<section class="content-section">
  <h2>Career</h2>
  <div class="experience-stats" id="exp-stats"></div>
  <div class="timeline-container" id="exp-timeline"></div>
</section>

<section id="site-contact"></section>
<footer  id="site-footer"></footer>

<script src="render.js"></script>
<script src="main.js"></script>
<script>
  SiteRender.bootstrapPage({
    activePage: 'professional-experience.html',
    renderBody(content) {
      const exp = content.experience;

      /* ---- Stats Row (2.1), replaced all four ---- */
      const stats = [
        { value: '3',  label: 'Countries',          sub: 'UAE · Malaysia · Morocco' },
        { value: '14+', label: 'Projects Built',     sub: 'Across all disciplines' },
        { value: '4',  label: 'Disciplines',        sub: 'Mechanical · Electrical · Software · Management' },
      ];
      document.getElementById('exp-stats').innerHTML = stats.map(s => `
        <div class="stat-card" title="${s.sub}">
          <h3>${s.value}</h3>
          <p>${s.label}</p>
          <p class="stat-sub">${s.sub}</p>
        </div>
      `).join('');

      /* ---- Timeline ---- */
      document.getElementById('exp-timeline').innerHTML = exp.map((job, i) => {
        const overview = (job.overview || []).map(line =>
          `<li>${SiteRender.esc(line)}</li>`
        ).join('');

        const achievements = (job.achievements || []).map(line =>
          `<li>${SiteRender.esc(line)}</li>`
        ).join('');

        const chips = (job.skills || []).map(s => {
          const slug = encodeURIComponent(s.replace(/-/g, ' ').trim());
          const label = s.replace(/-/g, ' ');
          return `<a href="my-skills.html#${s}" class="skill-tag-mini">${SiteRender.esc(label)}</a>`;
        }).join('');

        // First item = current role → pulse dot (cat 7)
        const dotClass = i === 0 ? 'timeline-dot timeline-dot--current' : 'timeline-dot';

        return `
          <div class="timeline-item">
            <div class="timeline-marker">
              <div class="${dotClass}" style="--timeline-color:${SiteRender.esc(job.color)};
                background:${SiteRender.esc(job.color)};
                box-shadow:0 0 0 3px ${SiteRender.esc(job.color)};"></div>
            </div>
            <div class="timeline-content" style="border-left-color:${SiteRender.esc(job.color)}">
              <div class="timeline-header">
                <div>
                  <h3 style="color:${SiteRender.esc(job.color)}">${SiteRender.esc(job.title)}</h3>
                  <p class="company">${SiteRender.esc(job.company)}</p>
                  <p class="location">📍 ${SiteRender.esc(job.location)}</p>
                </div>
                <div class="timeline-date">
                  <span class="date-range">${SiteRender.esc(job.dateRange)}</span>
                  <span class="duration" style="background:${SiteRender.esc(job.color)}">${SiteRender.esc(job.duration)}</span>
                </div>
              </div>
              <div class="timeline-body">
                ${overview     ? `<h4>Overview</h4><ul>${overview}</ul>` : ''}
                ${achievements ? `<h4>Key Achievements</h4><ul>${achievements}</ul>` : ''}
                ${chips ? `
                  <div class="timeline-skills">
                    <strong>Skills used:</strong> ${chips}
                  </div>` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');

      /* ---- Copy buttons on each timeline card (4.1) ---- */
      document.querySelectorAll('.timeline-content').forEach((card, i) => {
        const job = exp[i];
        if (!job) return;
        makeCopyable(card, () => {
          const lines = [
            `SEIF-EDDINE JOUL – Professional Experience`,
            `──────────────────────────────────`,
            `Role: ${job.title} @ ${job.company}`,
            `Period: ${job.dateRange} (${job.duration})`,
            `Location: ${job.location}`,
          ];
          if (job.achievements && job.achievements.length) {
            lines.push('', 'Key Achievements:');
            job.achievements.forEach(a => lines.push(`  • ${a}`));
          }
          lines.push('', `Portfolio: ${location.origin}`, `Contact: seifjoul@gmail.com`);
          return lines.join('\n');
        });
      });
    }
  });
</script>

</body>
</html>
