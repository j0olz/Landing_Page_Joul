<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Personal Life | Seif Joul</title>
  <meta property="og:title"       content="Personal Life – Seif-Eddine Joul" />
  <meta property="og:description" content="Background, martial arts, hobbies, values, and what drives me beyond work." />
  <meta property="og:image"       content="icons/face.jpeg" />
  <link rel="icon" href="icons/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header id="site-header"></header>
<nav    id="site-nav"></nav>
<div   id="floating-buttons"></div>

<section class="content-section">
  <h2>Life Beyond Work</h2>
  <div class="personal-grid" id="personal-grid"></div>
</section>

<section id="site-contact"></section>
<footer  id="site-footer"></footer>

<script src="render.js"></script>
<script src="main.js"></script>
<script>
  SiteRender.bootstrapPage({
    activePage: 'personal-life.html',
    renderBody(content) {
      document.getElementById('personal-grid').innerHTML =
        content.personalLife.map(card => `
          <div class="personal-card">
            <div class="card-icon"></div>
            <h3>${SiteRender.esc(card.title)}</h3>
            <p>${SiteRender.esc(card.body)}</p>
          </div>
        `).join('');

      /* Copy buttons */
      document.querySelectorAll('.personal-card').forEach((card, i) => {
        const item = content.personalLife[i];
        if (!item) return;
        makeCopyable(card, () => {
          return [
            `SEIF-EDDINE JOUL – Personal Life`,
            `──────────────────────────────────`,
            `Personal Life – ${item.title}`,
            `  • ${item.body}`,
            ``,
            `Portfolio: ${location.origin}`,
          ].join('\n');
        });
      });
    }
  });
</script>

</body>
</html>
