<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Certificates | Seif Joul</title>
  <meta property="og:title"       content="Certifications – Seif-Eddine Joul" />
  <meta property="og:description" content="Academic, engineering, and professional development certifications." />
  <meta property="og:image"       content="icons/face.png" />
  <link rel="icon" href="icons/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header id="site-header"></header>
<nav    id="site-nav"></nav>
<div   id="floating-buttons"></div>

<section class="content-section">
  <h2>Certifications &amp; Qualifications</h2>
  <div class="skills-container" id="cert-list"></div>
</section>

<section id="site-contact"></section>
<footer  id="site-footer"></footer>

<script src="render.js"></script>
<script src="main.js"></script>
<script>
  SiteRender.bootstrapPage({
    activePage: 'my-certifications.html',
    renderBody(content) {
      document.getElementById('cert-list').innerHTML =
        content.certifications.map(cat => `
          <div class="skill-category">
            <h3>${SiteRender.esc(cat.category)}</h3>
            <div class="skill-tags">
              ${cat.items.map(item =>
                `<span class="skill-tag">${SiteRender.esc(item)}</span>`
              ).join('')}
            </div>
          </div>
        `).join('');

      /* Copy buttons */
      document.querySelectorAll('.skill-category').forEach((card, i) => {
        const cat = content.certifications[i];
        if (!cat) return;
        makeCopyable(card, () => {
          return [
            `SEIF-EDDINE JOUL – Certifications`,
            `──────────────────────────────────`,
            `Category: ${cat.category}`,
            `  • ${cat.items.join('\n  • ')}`,
            ``,
            `Portfolio: ${location.origin}`,
            `Contact: seifjoul@gmail.com`,
          ].join('\n');
        });
      });
    }
  });
</script>

</body>
</html>
