<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Skills | Seif Joul</title>
  <meta property="og:title"       content="Skills – Seif-Eddine Joul" />
  <meta property="og:description" content="50+ skills across technical, software, quality, and management disciplines." />
  <meta property="og:image"       content="icons/face.png" />
  <link rel="icon" href="icons/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header id="site-header"></header>
<nav    id="site-nav"></nav>
<div   id="floating-buttons"></div>

<section class="content-section">
  <h2>Skills Overview</h2>
  <p style="color:var(--text-muted);font-size:0.9rem;margin-bottom:1.5rem;">
    <em>Hover over any skill to see where it was applied… (tap on mobile)</em>
  </p>
  <div class="skills-container" id="skills-container"></div>
  <div id="skill-tooltip" class="skill-tooltip"></div>
</section>

<section id="site-contact"></section>
<footer  id="site-footer"></footer>

<script src="render.js"></script>
<script src="main.js"></script>
<script>
  let _skillMappings = {};

  function getProjectsForSkill(skillName) {
    return _skillMappings[skillName] || [];
  }

  SiteRender.bootstrapPage({
    activePage: 'my-skills.html',
    async renderBody(content, skills) {
      _skillMappings = skills.projectMappings || {};

      document.getElementById('skills-container').innerHTML =
        skills.categories.map(cat => {
          const chips = cat.skills.map(skill => {
            const slug = encodeURIComponent(skill.replace(/\s+/g, '-'));
            return `<span class="skill-tag" data-skill="${SiteRender.esc(skill)}" id="${slug}">${SiteRender.esc(skill)}</span>`;
          }).join('');

          return `
            <div class="skill-category">
              <h3>${SiteRender.esc(cat.title)}</h3>
              <div class="skill-tags">${chips}</div>
            </div>
          `;
        }).join('');

      /* Copy buttons on each skill category card (4.1) */
      document.querySelectorAll('.skill-category').forEach((card, i) => {
        const cat = skills.categories[i];
        if (!cat) return;
        makeCopyable(card, () => {
          const lines = [
            `SEIF-EDDINE JOUL – Skills`,
            `──────────────────────────────────`,
            `Category: ${cat.title}`,
            `  • ${cat.skills.join('\n  • ')}`,
            ``,
            `Portfolio: ${location.origin}`,
            `Contact: seifjoul@gmail.com`,
          ];
          return lines.join('\n');
        });
      });
    }
  });
</script>

</body>
</html>
