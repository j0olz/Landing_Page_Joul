<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Education | Seif Joul</title>
  <meta property="og:title"       content="Education – Seif-Eddine Joul" />
  <meta property="og:description" content="BEng Mechatronics (Hons) – USM #137 globally. American Curriculum HS Diploma." />
  <meta property="og:image"       content="icons/face.png" />
  <link rel="icon" href="icons/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header id="site-header"></header>
<nav    id="site-nav"></nav>
<div   id="floating-buttons"></div>

<section class="content-section">
  <h2>Academic Background</h2>
  <div class="skills-container" id="edu-list"></div>
</section>

<section id="site-contact"></section>
<footer  id="site-footer"></footer>

<script src="render.js"></script>
<script src="main.js"></script>
<script>
  SiteRender.bootstrapPage({
    activePage: 'education.html',
    renderBody(content) {
      document.getElementById('edu-list').innerHTML =
        content.education.map(edu => {
          const courses = edu.courses.map(c =>
            `<span class="skill-tag">${SiteRender.esc(c)}</span>`
          ).join('');

          const achievements = edu.achievements.map(a =>
            `<li>${SiteRender.esc(a)}</li>`
          ).join('');

          const rankBlock = edu.rank ? `
            <div class="edu-split">
              <div class="edu-achievements">
                <p><strong>Achievements:</strong></p>
                <ul>${achievements}</ul>
              </div>
              <div class="edu-vline" aria-hidden="true"></div>
              <div class="edu-rank">
                <p><strong>Global Rank:</strong></p>
                <div class="edu-rank-value">${edu.rank.value}</div>
                <div class="edu-rank-note">${SiteRender.esc(edu.rank.note)}</div>
              </div>
            </div>
          ` : `
            <div class="edu-block">
              <p><strong>Achievements:</strong></p>
              <ul>${achievements}</ul>
            </div>
          `;

          const coursesLabel = edu.courses.length && edu.courses.some(c => c.includes('Science'))
            ? 'Focus Areas' : 'Relevant Courses';

          return `
            <div class="skill-category">
              <div class="education-details">
                <div class="edu-top-row">
                  <div class="edu-top-title">${SiteRender.esc(edu.type)}</div>
                  <div class="edu-top-date">${SiteRender.esc(edu.dateRange)}</div>
                </div>
                <div class="edu-degree-name">${SiteRender.esc(edu.degree)}</div>
                <div class="edu-meta-row">
                  <div class="edu-school">${SiteRender.esc(edu.school)}</div>
                  <div class="edu-location">📍 ${SiteRender.esc(edu.location)}</div>
                </div>
                <div class="edu-block">
                  <p><strong>${coursesLabel}:</strong></p>
                  <div class="skill-tags">${courses}</div>
                </div>
                ${rankBlock}
              </div>
            </div>
          `;
        }).join('');

      /* Copy buttons */
      document.querySelectorAll('.skill-category').forEach((card, i) => {
        const edu = content.education[i];
        if (!edu) return;
        makeCopyable(card, () => {
          return [
            `SEIF-EDDINE JOUL – Education`,
            `──────────────────────────────────`,
            `${edu.type}: ${edu.degree}`,
            `School: ${edu.school}, ${edu.location}`,
            `Period: ${edu.dateRange}`,
            edu.rank ? `Global Rank: ${edu.rank.value} (${edu.rank.note})` : '',
            `Achievements:`,
            edu.achievements.map(a => `  • ${a}`).join('\n'),
            ``,
            `Portfolio: ${location.origin}`,
            `Contact: seifjoul@gmail.com`,
          ].filter(l => l !== '').join('\n');
        });
      });
    }
  });
</script>

</body>
</html>
