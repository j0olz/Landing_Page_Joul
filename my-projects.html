<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Projects | Seif Joul</title>
  <meta property="og:title"       content="Projects – Seif-Eddine Joul" />
  <meta property="og:description" content="14 engineering projects spanning robotics, automation, embedded systems, and more." />
  <meta property="og:image"       content="icons/face.jpeg" />
  <link rel="icon" href="icons/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header id="site-header"></header>
<nav    id="site-nav"></nav>
<div   id="floating-buttons"></div>

<section class="content-section">
  <h2>Featured Projects</h2>
  <div class="project-cards-grid" id="project-grid"></div>
</section>

<section id="site-contact"></section>
<footer  id="site-footer"></footer>

<script src="render.js"></script>
<script src="main.js"></script>
<script>
  SiteRender.bootstrapPage({
    activePage: 'my-projects.html',
    renderBody(content) {
      document.getElementById('project-grid').innerHTML =
        content.projects.map(p => {
          const chips = (p.skills || []).map(s => {
            const slug = encodeURIComponent(s.replace(/\s+/g, '-'));
            return `<a href="my-skills.html#${slug}" class="skill-tag-mini">${SiteRender.esc(s)}</a>`;
          }).join('');

          return `
            <div class="project-card">
              <span class="category-tag ${SiteRender.esc(p.category)}">${SiteRender.esc(p.categoryLabel)}</span>
              <h3>${SiteRender.esc(p.name)}</h3>
              <p>${SiteRender.esc(p.body)}</p>
              ${chips ? `
                <div class="project-card-skills">
                  <strong>Using:</strong> ${chips}
                </div>` : ''}
            </div>
          `;
        }).join('');

      /* Copy buttons on each project card (4.1) */
      document.querySelectorAll('.project-card').forEach((card, i) => {
        const p = content.projects[i];
        if (!p) return;
        makeCopyable(card, () => {
          const lines = [
            `SEIF-EDDINE JOUL – Projects`,
            `──────────────────────────────────`,
            `Project: ${p.name}`,
            `Category: ${p.categoryLabel}`,
            ``,
            p.body,
          ];
          if (p.skills && p.skills.length) {
            lines.push('', `Skills: ${p.skills.join(', ')}`);
          }
          lines.push('', `Portfolio: ${location.origin}`);
          return lines.join('\n');
        });
      });
    }
  });
</script>

</body>
</html>
